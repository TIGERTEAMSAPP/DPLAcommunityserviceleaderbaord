<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DPLA Community Service Leaderboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(255, 215, 120, 0.13), transparent 32%),
        radial-gradient(circle at bottom right, rgba(180, 130, 35, 0.16), transparent 30%),
        linear-gradient(135deg, #252525 0%, #171717 50%, #0d0d0d 100%);
      color: #fff8e6;
      overflow-x: hidden;
      padding: 30px 15px;
    }
    .stars,
    .stars::before,
    .stars::after {
      position: fixed;
      top: -100px;
      left: -100px;
      width: calc(100% + 200px);
      height: calc(100% + 200px);
      content: "";
      background-image:
        radial-gradient(#fff4c2 1px, transparent 1px),
        radial-gradient(#d4af37 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px);
      background-size: 90px 90px, 140px 140px, 220px 220px;
      background-position: 0 0, 45px 65px, 80px 120px;
      opacity: 0.28;
      z-index: -3;
      animation: driftStars 70s ease-in-out infinite alternate;
    }
    .stars::before {
      opacity: 0.45;
      animation: driftStarsSlow 85s ease-in-out infinite alternate;
    }
    .stars::after {
      opacity: 0.35;
      animation: twinkleStars 4s ease-in-out infinite alternate;
    }
    .moon {
      position: fixed;
      top: 80px;
      left: 70px;
      width: 95px;
      height: 95px;
      background:
        radial-gradient(circle at 30% 30%, #fff3c4, #d8c895 45%, #6f664e 100%);
      border-radius: 50%;
      box-shadow: 0 0 35px rgba(255, 228, 156, 0.35);
      opacity: 0.85;
      z-index: -1;
    }
    .moon::before {
      content: "";
      position: absolute;
      top: 22px;
      left: 28px;
      width: 16px;
      height: 16px;
      background: rgba(40, 40, 40, 0.22);
      border-radius: 50%;
      box-shadow:
        28px 18px 0 rgba(40, 40, 40, 0.18),
        8px 42px 0 rgba(40, 40, 40, 0.14);
    }
    .planet {
      position: fixed;
      right: -85px;
      bottom: -85px;
      width: 280px;
      height: 280px;
      background:
        radial-gradient(circle at 35% 30%, #ffe9a6, #d4af37 35%, #6b4d14 78%);
      border-radius: 50%;
      box-shadow: 0 0 80px rgba(212, 175, 55, 0.35);
      z-index: -1;
    }
    .planet::before {
      content: "";
      position: absolute;
      top: 115px;
      left: -40px;
      width: 360px;
      height: 55px;
      border: 3px solid rgba(255, 221, 130, 0.55);
      border-radius: 50%;
      transform: rotate(-18deg);
    }
    .shooting-star {
      position: fixed;
      width: 130px;
      height: 2px;
      background: linear-gradient(
        90deg,
        rgba(255, 228, 156, 0),
        rgba(255, 228, 156, 0.95)
      );
      border-radius: 999px;
      box-shadow: 0 0 15px rgba(255, 228, 156, 0.8);
      transform: rotate(-25deg);
      z-index: -1;
      opacity: 0;
      animation: shootingStar 6s linear infinite;
    }
    .shooting-star::after {
      content: "";
      position: absolute;
      right: 0;
      top: -3px;
      width: 8px;
      height: 8px;
      background: #ffe49c;
      border-radius: 50%;
      box-shadow: 0 0 15px #ffe49c;
    }
    .shooting-star.one {
      top: 150px;
      left: 120px;
      animation-delay: 0s;
    }
    .shooting-star.two {
      top: 420px;
      left: 80px;
      width: 90px;
      animation-delay: 2.3s;
    }
    .shooting-star.three {
      top: 620px;
      left: 260px;
      width: 110px;
      animation-delay: 4.1s;
    }
    .asteroid {
      position: fixed;
      background: linear-gradient(135deg, #8c7a54, #3b3528);
      border-radius: 45% 55% 50% 40%;
      border: 1px solid rgba(255, 228, 156, 0.15);
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.4);
      z-index: -1;
      opacity: 0.6;
      animation: floatAsteroid 7s ease-in-out infinite alternate;
    }
    .asteroid::before {
      content: "";
      position: absolute;
      width: 28%;
      height: 28%;
      background: rgba(0, 0, 0, 0.18);
      border-radius: 50%;
      top: 25%;
      left: 20%;
      box-shadow:
        28px 18px 0 rgba(0, 0, 0, 0.13),
        12px 45px 0 rgba(0, 0, 0, 0.1);
    }
    .asteroid-one {
      width: 65px;
      height: 48px;
      top: 260px;
      right: 90px;
      animation-delay: 0s;
    }
    .asteroid-two {
      width: 42px;
      height: 34px;
      bottom: 180px;
      left: 100px;
      animation-delay: 1.5s;
    }
    .asteroid-three {
      width: 35px;
      height: 28px;
      top: 540px;
      right: 45%;
      animation-delay: 3s;
    }
    .gold-orb {
      position: fixed;
      border-radius: 50%;
      background: #ffd76a;
      box-shadow: 0 0 25px rgba(255, 215, 106, 0.75);
      z-index: -1;
      opacity: 0.6;
      animation: pulseOrb 3s ease-in-out infinite alternate;
    }
    .orb-one {
      width: 12px;
      height: 12px;
      top: 210px;
      left: 32%;
    }
    .orb-two {
      width: 18px;
      height: 18px;
      top: 510px;
      right: 18%;
      animation-delay: 1s;
    }
    .orb-three {
      width: 9px;
      height: 9px;
      bottom: 150px;
      left: 45%;
      animation-delay: 2s;
    }
    .container {
      max-width: 900px;
      margin: auto;
      position: relative;
      z-index: 2;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      margin-bottom: 10px;
      color: #ffe49c;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.55);
    }
    .subtitle {
      color: #d8c895;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .stat-card {
      background: rgba(38, 38, 38, 0.82);
      border: 1px solid rgba(212, 175, 55, 0.35);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .stat-card h2 {
      font-size: 2rem;
      color: #ffd76a;
    }
    .stat-card p {
      color: #d8c895;
      margin-top: 5px;
    }
    .leaderboard {
      background: rgba(25, 25, 25, 0.88);
      border: 1px solid rgba(212, 175, 55, 0.38);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    .leaderboard-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .leaderboard-title h2 {
      color: #ffe49c;
    }
    .refresh-button {
      background: linear-gradient(135deg, #ffe49c, #d4af37);
      color: #181818;
      border: none;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .refresh-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.45);
    }
    .row {
      display: grid;
      grid-template-columns: 70px 1fr 120px;
      align-items: center;
      gap: 10px;
      padding: 16px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.055);
      border-radius: 16px;
      border: 1px solid rgba(212, 175, 55, 0.18);
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.02);
    }
    .rank {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffd76a;
    }
    .name {
      font-weight: bold;
      font-size: 1.05rem;
      color: #fff8e6;
    }
    .hours {
      text-align: right;
      font-weight: bold;
      color: #ffe49c;
    }
    .first {
      background: linear-gradient(
        135deg,
        rgba(255, 215, 106, 0.25),
        rgba(255, 255, 255, 0.06)
      );
      border-color: rgba(255, 215, 106, 0.55);
    }
    .second {
      background: linear-gradient(
        135deg,
        rgba(210, 210, 210, 0.18),
        rgba(255, 255, 255, 0.055)
      );
      border-color: rgba(210, 210, 210, 0.35);
    }
    .third {
      background: linear-gradient(
        135deg,
        rgba(181, 111, 45, 0.22),
        rgba(255, 255, 255, 0.055)
      );
      border-color: rgba(181, 111, 45, 0.42);
    }
    .loading,
    .error {
      text-align: center;
      padding: 25px;
      color: #d8c895;
    }
    .footer-note {
      text-align: center;
      color: #a99b73;
      font-size: 0.9rem;
      margin-top: 16px;
    }
    @keyframes driftStars {
      0% {
        transform: translate(0, 0);
      }
      25% {
        transform: translate(-30px, 20px);
      }
      50% {
        transform: translate(20px, -25px);
      }
      75% {
        transform: translate(-20px, -10px);
      }
      100% {
        transform: translate(30px, 25px);
      }
    }
    @keyframes driftStarsSlow {
      0% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(-45px, 35px);
      }
      100% {
        transform: translate(35px, -20px);
      }
    }
    @keyframes twinkleStars {
      from {
        opacity: 0.18;
      }
      to {
        opacity: 0.42;
      }
    }
    @keyframes shootingStar {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(-25deg);
      }
      8% {
        opacity: 1;
      }
      35% {
        opacity: 0;
        transform: translate(350px, 160px) rotate(-25deg);
      }
      100% {
        opacity: 0;
        transform: translate(350px, 160px) rotate(-25deg);
      }
    }
    @keyframes floatAsteroid {
      from {
        transform: translateY(0) rotate(0deg);
      }
      to {
        transform: translateY(-22px) rotate(12deg);
      }
    }
    @keyframes pulseOrb {
      from {
        opacity: 0.35;
        transform: scale(1);
      }
      to {
        opacity: 0.85;
        transform: scale(1.25);
      }
    }
    @media (max-width: 600px) {
      body {
        padding: 20px 12px;
      }
      .row {
        grid-template-columns: 50px 1fr 90px;
        padding: 13px;
      }
      .moon {
        width: 65px;
        height: 65px;
        top: 55px;
        left: 25px;
      }
      .planet {
        width: 210px;
        height: 210px;
        right: -80px;
        bottom: -70px;
      }
      .planet::before {
        width: 270px;
        top: 88px;
        left: -35px;
      }
      .shooting-star.three,
      .asteroid-three {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="shooting-star one"></div>
  <div class="shooting-star two"></div>
  <div class="shooting-star three"></div>
  <div class="moon"></div>
  <div class="planet"></div>
  <div class="asteroid asteroid-one"></div>
  <div class="asteroid asteroid-two"></div>
  <div class="asteroid asteroid-three"></div>
  <div class="gold-orb orb-one"></div>
  <div class="gold-orb orb-two"></div>
  <div class="gold-orb orb-three"></div>
  <div class="container">
    <header>
      <h1>DPLA Community Service Leaderboard</h1>
      <p class="subtitle">DEDICATED PURPOSE LEADERSHIP ACADEMY</p>
    </header>
    <section class="stats">
      <div class="stat-card">
        <h2 id="totalHours">0</h2>
        <p>Total Service Hours</p>
      </div>
      <div class="stat-card">
        <h2 id="totalStudents">0</h2>
        <p>Students Participating</p>
      </div>
      <div class="stat-card">
        <h2 id="topVolunteer">—</h2>
        <p>Most Dedicated</p>
      </div>
    </section>
    <main class="leaderboard">
      <div class="leaderboard-title">
        <h2>🌟 Top Rankings</h2>
        <button class="refresh-button" onclick="loadLeaderboard()">Refresh</button>
      </div>
      <div id="leaderboardList" class="loading">Loading leaderboard...</div>
    </main>
    <p class="footer-note">
      Update the Google Sheet and refresh this page to update the leaderboard.
    </p>
  </div>
  <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSPVumJkc_oT4l73Z9LfUMdlIaN_TjfhILZLVGDvi1SlyfdzbKGnLVP9dWeyoBcfKvkrxye4aLcZw2G/pub?output=csv";
    async function loadLeaderboard() {
      const leaderboardList = document.getElementById("leaderboardList");
      leaderboardList.className = "loading";
      leaderboardList.innerHTML = "Loading leaderboard...";
      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvText = await response.text();
        const data = parseCSV(csvText);
        const leaderboard = data
          .map(row => ({
            name: row.Name || row.name || "Unnamed",
            hours: Number(row.Hours || row.hours || 0)
          }))
          .filter(person => person.name && !isNaN(person.hours))
          .sort((a, b) => b.hours - a.hours);
        renderLeaderboard(leaderboard);
      } catch (error) {
        leaderboardList.className = "error";
        leaderboardList.innerHTML = `⚠️ ${error.message}`;
      }
    }
    function parseCSV(csv) {
      const lines = csv.trim().split("\n");
      const headers = lines[0].split(",").map(header => header.trim());
      return lines.slice(1).map(line => {
        const values = line.split(",").map(value => value.trim());
        const row = {};
        headers.forEach((header, index) => {
          row[header] = values[index];
        });
        return row;
      });
    }
    function renderLeaderboard(leaderboard) {
      const leaderboardList = document.getElementById("leaderboardList");
      const totalHours = leaderboard.reduce((sum, person) => sum + person.hours, 0);
      document.getElementById("totalHours").textContent = totalHours;
      document.getElementById("totalStudents").textContent = leaderboard.length;
      document.getElementById("topVolunteer").textContent = leaderboard[0]?.name || "—";
      if (leaderboard.length === 0) {
        leaderboardList.className = "error";
        leaderboardList.innerHTML = "No leaderboard data found.";
        return;
      }
      leaderboardList.className = "";
      leaderboardList.innerHTML = leaderboard.map((person, index) => {
        let medal = "";
        let specialClass = "";
        if (index === 0) {
          medal = "🥇";
          specialClass = "first";
        } else if (index === 1) {
          medal = "🥈";
          specialClass = "second";
        } else if (index === 2) {
          medal = "🥉";
          specialClass = "third";
        } else {
          medal = `#${index + 1}`;
        }
        return `
          <div class="row ${specialClass}">
            <div class="rank">${medal}</div>
            <div class="name">${person.name}</div>
            <div class="hours">${person.hours} hrs</div>
          </div>
        `;
      }).join("");
    }
    loadLeaderboard();
  </script>
</body>
</html>
